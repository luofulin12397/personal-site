    <h1>WrenAI · Agent 写了 SQL，为什么还要经过 Wren？</h1>
    <p>一个源码学习案例：查询写的是 orders，规划后读的是 fixture.public.raw_orders。</p>
    <p>同一句 SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id ORDER BY customer_id 的实测：</p>
    <pre>dry-plan：输出展开后的 SQL，包含物理表 fixture.public.raw_orders
dry-run：OK
query --read-only：{"customer_id": 101, "order_count": 2}
{"customer_id": 202, "order_count": 1}

仅从 manifest 移除 orders 后：
[MODEL_NOT_FOUND] … phase=SQL_POLICY_CHECK
直接核对 DuckDB，物理表仍有 3 行。</pre>
